services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: beard_style_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bearduser
      POSTGRES_PASSWORD: beardpass123
      POSTGRES_DB: beard_style_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./database/migrations:/docker-entrypoint-initdb.d/migrations
      - ./database/seeds:/docker-entrypoint-initdb.d/seeds
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bearduser -d beard_style_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: beard_style_api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-bearduser}:${POSTGRES_PASSWORD:-beardpass123}@postgres:5432/${POSTGRES_DB:-beard_style_db}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      USE_MOCK_AI: ${USE_MOCK_AI:-true}
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN:-}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run dev

  # Frontend React App (nginx serves built React app)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: beard_style_frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: beard_style_network
