server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Dozvoli upload do 25MB (slike + base64 payloadi)
    client_max_body_size 25m;

    # Gzip kompresija
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    # API proxy → backend kontejner
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;  # AI processing može trajati duže
    }

    # Uploads proxy → backend kontejner
    location /uploads/ {
        proxy_pass http://backend:5000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_cache_valid 200 30d;
    }

    # Assets — serviraj iz React builda (sketches, thumbnails itd.)
    location /assets/ {
        try_files $uri @backend_assets;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Fallback na backend za assets koji nisu u buildu (mock slike itd.)
    location @backend_assets {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Statički fajlovi — cache 1 godina (hash u imenu)
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React SPA — sve ostale rute vrati na index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
